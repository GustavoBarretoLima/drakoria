<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escolha seu Herói - Drakoria</title>
    <script type="module" crossorigin src="/drakoria/assets/personagens-B08bskcr.js"></script>
    <link rel="modulepreload" crossorigin href="/drakoria/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/drakoria/assets/heroVitals-Bi6d7zM4.js">
    <link rel="stylesheet" crossorigin href="/drakoria/assets/personagens-BaAH3gXj.css">
    <link rel="stylesheet" crossorigin href="/drakoria/assets/main-DDGBXaC2.css">
    <link rel="stylesheet" crossorigin href="/drakoria/assets/responsive-C6lUKH0I.css">
  </head>
  <body>
    <section id="selecao">
      <h1>Escolha seu Herói</h1>
      <p>Selecione a classe que guiará seu destino em Drakoria.</p>

      <!-- Campo para nome do herói -->
      <div class="opcoes-nome">
        <label for="nomeHeroi">Digite o nome do seu herói:</label>
        <input
          type="text"
          id="nomeHeroi"
          placeholder="Ex: Arthan, Lyra, Kael..."
          required
        />
        <!-- Mensagem de erro inline -->
        <p id="erroNome" class="mensagem-erro"></p>
      </div>

      <!-- Escolha de gênero -->
      <div class="opcoes-genero">
        <button data-genero="masculino" onclick="selecionarGenero('masculino')">
          Masculino
        </button>
        <button data-genero="feminino" onclick="selecionarGenero('feminino')">
          Feminino
        </button>
      </div>

      <!-- Cards lado a lado -->
      <div class="cards">
        <!-- Guerreiro -->
        <div class="card">
          <img
            id="imgGuerreiro"
            src="/drakoria/assets/guerreiro-vmwxwYtR.png"
            alt="Guerreiro"
          />
          <h2 id="nomeGuerreiro">Guerreiro</h2>
          <p>Força e coragem indomáveis.</p>
          <button
            id="btnSelecionarGuerreiro"
            onclick="selecionarPersonagem('Guerreiro')"
          >
            Selecionar
          </button>
        </div>

        <!-- Mago -->
        <div class="card">
          <img id="imgMago" src="/drakoria/assets/mago-BWu5ABoI.png" alt="Mago" />
          <h2 id="nomeMago">Mago</h2>
          <p>
            Domina os elementos e conjura feitiços poderosos contra seus
            inimigos.
          </p>
          <button id="btnSelecionarMago" onclick="selecionarPersonagem('Mago')">
            Selecionar
          </button>
        </div>

        <!-- Arqueiro -->
        <div class="card">
          <img
            id="imgArqueiro"
            src="/drakoria/assets/arqueiro-aX2HUOMW.png"
            alt="Arqueiro"
          />
          <h2 id="nomeArqueiro">Arqueiro</h2>
          <p>Ágil e preciso, ataca de longe com flechas certeiras.</p>
          <button
            id="btnSelecionarArqueiro"
            onclick="selecionarPersonagem('Arqueiro')"
          >
            Selecionar
          </button>
        </div>
      </div>
    </section>

    <script src="../js/personagens.js" defer></script>
  </body>
</html>
