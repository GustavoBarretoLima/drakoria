<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Praça de Drakoria</title>
    <link rel="stylesheet" href="../css/praca.css" />
    <link rel="stylesheet" href="../css/town-board.css" />
    <link rel="stylesheet" href="../css/inventario.css" />
    <link rel="stylesheet" href="../css/status-inventory.css" />
    <link rel="stylesheet" href="../css/status-paper-doll-fixes.css" />
    <link rel="stylesheet" href="../css/dungeon-ranges.css" />
    <link rel="stylesheet" href="../css/subclass-books.css" />
    <link rel="stylesheet" href="../css/character-jrpg.css" />
    <script src="../js/progresso.js" defer></script>
    <script src="../js/inventory-backpack.js" defer></script>
    <script src="../js/praca.js" defer></script>
    <script type="module" src="../js/status-level-scaling.js"></script>
    <script type="module" src="../client/src/pages/cityRecovery.ts"></script>
    <script type="module" src="../client/src/pages/townBoard.ts"></script>
    <script type="module" src="../client/src/pages/inventoryPotions.ts"></script>
    <script src="../js/status-inventory-ux.js" defer></script>
    <script type="module" src="../js/subclass-books.js"></script>
    <script src="../js/itens.js" defer></script>
    <script src="../js/personagens.js" defer></script>
  </head>

  <body>
    <button id="abrirMenuBtn" class="abrir-menu-btn" type="button">☰ Menu</button>

    <nav id="menuPraca" class="menu-flutuante hidden" aria-label="Menu da Praça">
      <button type="button" onclick="abrirInventario()">🎒 Inventário</button>
      <button type="button" onclick="abrirStatus()">📊 Status</button>
      <button type="button" onclick="abrirLivrosClasse()">📚 Livros de Classe</button>
      <button type="button" onclick="abrirLoja()">🏪 Loja</button>
      <button type="button" onclick="abrirMissoes()">📜 Missões</button>
      <button type="button" onclick="window.location.href = 'mapa.html'">🗺️ Mapa de Drakoria</button>
    </nav>

    <main id="praca" class="drakoria-praca">
      <div class="hotspot taberna" onclick="window.location.href = 'estabelecimentos.html#taberna'" data-tooltip="🍺 Entrar na Taberna">
        <span class="icon">🍺</span>
      </div>

      <div class="hotspot ferreiro" onclick="window.location.href = 'estabelecimentos.html#ferreiro'" data-tooltip="⚒️ Ir ao Ferreiro">
        <span class="icon">⚒️</span>
      </div>

      <div class="hotspot guilda" onclick="window.location.href = 'estabelecimentos.html#guilda'" data-tooltip="🛡️ Guilda dos Aventureiros">
        <span class="icon">🛡️</span>
      </div>

      <section id="painelPraca" class="painel-praca hidden"></section>
    </main>
  </body>
