<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Drakoria - Estabelecimentos</title>
    <link rel="stylesheet" href="../css/estabelecimentos.css" />
    <script src="../js/estabelecimentos.js"></script>
    <script type="module" src="../client/src/pages/tavernShop.ts"></script>
    <script type="module" src="../client/src/pages/blacksmith.ts"></script>
    <link rel="stylesheet" href="../css/equipment-art.css" />
    <link rel="stylesheet" href="../css/blacksmith.css" />
      <link rel="stylesheet" href="../css/city-sidebar.css" />
    <script type="module" src="../client/src/pages/cityNavigation.ts"></script>
  </head>
  <body class="has-city-sidebar">
    <nav id="menuPraca" class="city-sidebar" aria-label="Menu da cidade">
      <a href="praca.html?status=1" data-city-panel="status">Status</a>
      <a href="praca.html?livros=1" data-city-panel="livros">Livros de classe</a>
      <a href="praca.html?loja=1" data-city-panel="loja">Loja</a>
      <a href="mapa.html">Mapa de Drakoria</a>
      <a href="estabelecimentos.html#taberna">Taberna</a>
      <a href="estabelecimentos.html#ferreiro">Ferreiro</a>
      <a href="praca.html?guilda=1" data-city-panel="guilda">Guilda</a>
    </nav>
    <!-- Praça principal -->
    <div id="praca" class="drakoria-praca fade">
      <div
        class="hotspot taberna"
        onclick="carregarTaberna()"
        data-tooltip="🍺 Entrar na Taberna"
      >
        <span class="icon">🍺</span>
      </div>

      <div
        class="hotspot ferreiro"
        onclick="carregarFerreiro()"
        data-tooltip="⚒️ Ir ao Ferreiro"
      >
        <span class="icon">⚒️</span>
      </div>

      <div
        class="hotspot guilda"
        onclick="carregarGuilda()"
        data-tooltip="🛡️ Guilda dos Aventureiros"
      >
        <span class="icon">🛡️</span>
      </div>
    </div>

    <!-- Interiores -->
    <div id="taberna" style="display: none"></div>
    <div id="ferreiro" style="display: none"></div>
    <div id="guilda" style="display: none"></div>
  </body>
</html>
