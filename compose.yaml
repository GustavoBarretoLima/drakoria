services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: drakoria
      POSTGRES_USER: drakoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - drakoria-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drakoria -d drakoria"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  drakoria-postgres:
